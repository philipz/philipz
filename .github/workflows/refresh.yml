name: refresh readout

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: regenerate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_readout.py
      - name: commit if changed
        run: |
          git config user.name "readout-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet assets/readout.svg; then
            git add assets/readout.svg
            git commit -m "chore: refresh readout"
            git push
          fi
